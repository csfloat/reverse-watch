name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.x  

      - name: Download dependencies
        run: |
          go mod download

      - name: Test
        run: |
          go test ./...
