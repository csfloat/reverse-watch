name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-internal 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data/
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.x  

      - name: Download dependencies
        run: |
          go mod download

      - name: Test
        run: |
          go test ./...
