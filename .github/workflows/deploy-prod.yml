name: Deploy to Production
on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Check Version Format
        run: |
          VERSION_REGEX="^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$"
          if [[ "${{ github.ref }}" =~ $VERSION_REGEX ]]; then
            echo "Version format is correct"
          else
            echo "Version format is incorrect"
            exit 1
          fi

      - name: Authorize Docker
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE_NAME="us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/reverse-watch/prod:${{ github.ref_name }}"
          docker build --tag $IMAGE_NAME .
          docker push $IMAGE_NAME
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy reverse-watch \
            --image us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/reverse-watch/prod:${{ github.ref_name }} \
            --region us-west1 \
            --min-instances 1 \
            --max-instances 4 \
            --port 8080 \
            --set-secrets DATABASE_HOST=db-host:latest \
            --set-secrets DATABASE_PASSWORD=db-password:latest \
            --set-secrets DATABASE_USER=db-user:latest \
            --set-secrets ENVIRONMENT=environment:latest \
            --set-secrets TRUSTPROXY=trust-proxy:latest \
            --set-secrets INGESTORS_CSFLOAT_ENABLE=ingestors-csfloat-enable:latest \
            --set-secrets INGESTORS_CSFLOAT_BASEURL=ingestors-csfloat-baseurl:latest \
            --set-secrets INGESTORS_CSFLOAT_SECRETKEY=ingestors-csfloat-secretkey:latest \
            --add-cloudsql-instances ${{ secrets.GCP_CLOUDSQL_INSTANCE_NAME }} \
            --ingress internal-and-cloud-load-balancing
            
