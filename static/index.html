<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reverse.watch</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231d9bf0'/><ellipse cx='16' cy='16' rx='10' ry='7' fill='%230f1419'/><circle cx='16' cy='16' r='4' fill='%23e7e9ea'/></svg>" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=report" />
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f26;
            --bg-card: #232b35;
            --text-primary: #e7e9ea;
            --text-secondary: #8b98a5;
            --accent: #1d9bf0;
            --accent-hover: #1a8cd8;
            --danger: #f4212e;
            --success: #00ba7c;
            --border: #2f3336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;

            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                max-width: 500px;
                width: 100%;
                
                header {
                    width: 100%;
                    text-align: center;
                    margin-bottom: 40px;
                    padding: 0 10px;
                    
                    .title {
                        font-size: 54px;
                        font-weight: 900;
                        margin-bottom: 8px;
                        letter-spacing: -0.5px;
                    }

                    .subtitle {
                        color: var(--text-secondary);
                        font-size: 16px;
                    }

                    @media (max-width: 768px) {
                        .title {
                            font-size: 42px;
                        }

                        .subtitle {
                            font-size: 14px;
                        }
                    }
                }

                .search-card {
                    width: 100%;
                    background: var(--bg-card);
                    border-radius: 16px;
                    padding: 24px;
                    border: 1px solid var(--border);
                    
                    .input-group {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 12px;
                        margin-bottom: 12px;
                        justify-content: center;

                        input[type="text"] {
                            flex: 1;
                            background: var(--bg-secondary);
                            border: 1px solid var(--border);
                            border-radius: 8px;
                            padding: 14px 16px;
                            font-size: 1rem;
                            color: var(--text-primary);
                            transition: border-color 0.2s, box-shadow 0.2s;

                            &:focus {
                                outline: none;
                                border-color: var(--accent);
                                box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.2);
                            }

                            &::placeholder {
                                font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
                                letter-spacing: -0.5px;
                                color: var(--text-secondary);
                            }
                        }

                        button {
                            background: var(--accent);
                            color: white;
                            border: none;
                            border-radius: 8px;
                            padding: 14px 24px;
                            font-size: 1rem;
                            font-weight: 600;
                            cursor: pointer;
                            transition: background-color 0.2s, transform 0.1s;

                            &:hover {
                                background: var(--accent-hover);
                            }

                            &:active {
                                transform: scale(0.98);
                            }

                            &:disabled {
                                opacity: 0.6;
                                cursor: not-allowed;
                            }
                        }

                        @media (max-width: 400px) {
                            flex-direction: column;
                            
                            input[type="text"] {
                                width: 100%;
                            }
                            
                            button {
                                width: 100%;
                            }
                        }
                    }

                    .hint {
                        text-align: center;
                        font-size: 0.85rem;
                        color: var(--text-secondary);
                    }
                }

                .result-card {
                    width: 100%;
                    margin-top: 24px;
                    background: var(--bg-card);
                    border-radius: 16px;
                    padding: 24px;
                    border: 1px solid var(--border);
                    display: none;
                    
                    &.visible {
                        display: block;
                        animation: fadeIn 0.3s ease;
                    }

                    .result-header {
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        margin-bottom: 16px;

                        .status-icon {
                            width: 48px;
                            height: 48px;
                            border-radius: 50%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 1.5rem;

                            &.clear {
                                background: rgba(0, 186, 124, 0.15);
                            }

                            &.flagged {
                                background: rgba(244, 33, 46, 0.15);
                            }
                        }

                        .result-title {
                            font-size: 1.25rem;
                            font-weight: 600;

                            &.clear {
                                color: var(--success);
                            }

                            &.flagged {
                                color: var(--danger);
                            }
                        }
                    }
                }

                .result-details {
                    background: var(--bg-secondary);
                    border-radius: 8px;
                    padding: 16px;

                    .detail-row {
                        display: flex;
                        justify-content: space-between;
                        padding: 8px 0;
                        
                        .detail-label {
                            color: var(--text-secondary);
                        }

                        .detail-value {
                            font-weight: 500;
                            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
                        }
                    }
                }

                .error-message {
                    width: 100%;
                    text-align: center;
                    margin-top: 24px;
                    background: rgba(244, 33, 46, 0.1);
                    border: 1px solid rgba(244, 33, 46, 0.3);
                    border-radius: 12px;
                    padding: 16px;
                    color: var(--danger);
                    display: none;
                    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;

                    &.visible {
                        display: block;
                        animation: fadeIn 0.3s ease;
                    }
                }
            }
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;

            a {
                color: var(--accent);
                text-decoration: none;

                &:hover {
                    text-decoration: underline;
                }
            }
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-size: 28px;
            line-height: 2;
            vertical-align: middle;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">reverse.watch</div>
            <p class="subtitle">Check if a Steam ID has a history of trade reversals</p>
        </header>

        <div class="search-card">
            <form id="searchForm">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="steamIdInput" 
                        placeholder="Steam ID (e.g., 76561198012345678)"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="searchBtn">Check</button>
                </div>
                <p class="hint">Enter a 64-bit Steam ID to check their reversal history</p>
            </form>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-header">
                <div class="status-icon" id="statusIcon"></div>
                <div class="result-title" id="resultTitle"></div>
            </div>
            <div class="result-details">
                <div class="detail-row">
                    <span class="detail-label">Steam ID</span>
                    <span class="detail-value" id="resultSteamId"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status</span>
                    <span class="detail-value" id="resultStatus"></span>
                </div>
                <div class="detail-row" id="lastReversalRow" style="display: none">
                    <span class="detail-label">Last Reversal</span>
                    <span class="detail-value" id="resultLastReversal"></span>
                </div>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>

    <footer>
        <p>Powered by <a href="https://csfloat.com" target="_blank">CSFloat</a></p>
    </footer>

    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('steamIdInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultCard = document.getElementById('resultCard');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const steamId = input.value.trim();
            if (!steamId) {
                return;
            }

            resultCard.classList.remove('visible');
            errorMessage.classList.remove('visible');

            searchBtn.disabled = true;
            searchBtn.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch(`http://localhost:3434/api/v1/users/${encodeURIComponent(steamId)}`);
                if (!response.ok) {
                    const errorData = await response.json();

                    let errorStr = `${errorData.code} - ${errorData.message}`
                    if (errorData.details) {
                        errorStr += ` (${errorData.details})`;
                    }
                    throw new Error(errorStr);
                }

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                showError(error.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Check';
            }
        });

        function displayResult(data) {
            const statusIcon = document.getElementById('statusIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultSteamId = document.getElementById('resultSteamId');
            const resultStatus = document.getElementById('resultStatus');
            const lastReversalRow = document.getElementById('lastReversalRow');
            const resultLastReversal = document.getElementById('resultLastReversal');

            resultSteamId.textContent = data.steam_id;

            if (data.has_reversed) {
                statusIcon.className = 'status-icon flagged';
                statusIcon.innerHTML = `<span class="material-symbols-outlined">report</span>`;

                resultTitle.className = 'result-title flagged';
                resultTitle.textContent = 'Reversal History Found';

                resultStatus.textContent = 'Has reversed';
                resultStatus.style.color = 'var(--danger)';

                if (data.last_reversal_timestamp) {
                    lastReversalRow.style.display = 'flex'

                    const date = new Date(data.last_reversal_timestamp);
                    resultLastReversal.textContent = date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                } else {
                    lastReversalRow.style.display = 'none';
                }
            } else {
                statusIcon.className = 'status-icon clear';
                statusIcon.textContent = '✓';

                resultTitle.className = 'result-title clear';
                resultTitle.textContent = 'No Reversals Found';

                resultStatus.textContent = 'Clear';
                resultStatus.style.color = 'var(--success)';

                lastReversalRow.style.display = 'none';
            }

            resultCard.classList.add('visible');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('visible');
        }

        input.addEventListener('input', () => {
            errorMessage.classList.remove('visible');
        });
    </script>
</body>
</html>
