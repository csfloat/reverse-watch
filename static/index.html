<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231d9bf0'/><ellipse cx='16' cy='16' rx='10' ry='7' fill='%230f1419'/><circle cx='16' cy='16' r='4' fill='%23e7e9ea'/></svg>" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>reverse.watch</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #16181c;
            --bg-card: rgba(22, 24, 28, 0.8);
            --text-primary: #e7e9ea;
            --text-secondary: #71767b;
            --accent: #1d9bf0;
            --accent-hover: #1a8cd8;
            --danger: #f4212e;
            --success: #00ba7c;
            --border: #2f3336;
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            background-image: radial-gradient(circle at 50% 0%, #1e2732 0%, #000000 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 1;

            header {
                width: 100%;
                text-align: center;
                margin-bottom: 48px;
                padding: 0 10px;

                .title {
                    font-size: 48px;
                    font-weight: 800;
                    margin-bottom: 12px;
                    letter-spacing: -1px;
                    background: linear-gradient(180deg, #fff 0%, #aab 100%);
                    background-clip: text;
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;

                    text-shadow: 0 2px 10px rgba(0,0,0,0.2);

                    @media (max-width: 600px) {
                        font-size: 36px;
                    }
                }

                .subtitle {
                    color: var(--text-secondary);
                    font-size: 18px;
                    font-weight: 400;
                    line-height: 1.5;
                }
            }

            .search-card {
                width: 100%;
                background: var(--bg-card);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: 24px;
                padding: 32px;
                border: 1px solid var(--glass-border);
                box-shadow: var(--shadow);
                transition: all 0.3s ease;

                @media (max-width: 600px) {
                    padding: 24px;
                }

                .input-group {
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                    margin-bottom: 16px;

                    input[type="text"] {
                        flex: 1;
                        background: rgba(0, 0, 0, 0.3);
                        border: 1px solid var(--border);
                        border-radius: 12px;
                        padding: 16px 20px;
                        font-size: 1.1rem;
                        color: var(--text-primary);
                        transition: all 0.2s ease;

                        &:focus {
                            outline: none;
                            border-color: var(--accent);
                            background: rgba(0, 0, 0, 0.5);
                            box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.15);
                        }

                        &::placeholder {
                            color: var(--text-secondary);
                            opacity: 0.7;
                        }
                    }

                    button {
                        width: auto;
                        min-width: 120px;
                        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
                        color: white;
                        border: none;
                        border-radius: 12px;
                        padding: 16px 24px;
                        font-size: 1.1rem;
                        font-weight: 700;
                        cursor: pointer;
                        transition: all 0.2s ease;
                        box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
                        text-shadow: 0 1px 2px rgba(0,0,0,0.1);

                        &:hover {
                            transform: translateY(-1px);
                            box-shadow: 0 8px 20px rgba(29, 155, 240, 0.4);
                            filter: brightness(1.1);
                        }

                        &:active {
                            transform: translateY(1px);
                        }

                        &:disabled {
                            opacity: 0.6;
                            cursor: not-allowed;
                            transform: none;
                        }

                        @media (max-width: 600px) {
                            width: 100%;
                        }
                    }
                }

                .hint {
                    text-align: center;
                    font-size: 0.9rem;
                    color: var(--text-secondary);
                    margin-top: 16px;
                }
            }

            .result-card {
                width: 100%;
                background: var(--bg-card);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: 24px;
                padding: 32px;
                border: 1px solid var(--glass-border);
                box-shadow: var(--shadow);
                transition: all 0.3s ease;
                margin-top: 24px;
                display: none;

                @media (max-width: 600px) {
                    padding: 24px;
                }

                &.visible {
                    display: block;
                    animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                }

                &.flagged {
                    border-color: rgba(244, 33, 46, 0.3);
                    box-shadow: 0 12px 40px rgba(244, 33, 46, 0.15);
                }

                &.clear {
                    border-color: rgba(0, 186, 124, 0.3);
                    box-shadow: 0 12px 40px rgba(0, 186, 124, 0.15);
                }

                .result-header {
                    display: flex;
                    align-items: center;
                    gap: 16px;
                    margin-bottom: 24px;

                    .status-icon {
                        width: 64px;
                        height: 64px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 2rem;
                        flex-shrink: 0;

                        @media (max-width: 600px) {
                            width: 56px;
                            height: 56px;
                            font-size: 1.75rem;
                        }

                        &.clear {
                            background: rgba(0, 186, 124, 0.1);
                            color: var(--success);
                            border: 1px solid rgba(0, 186, 124, 0.2);
                        }

                        &.flagged {
                            background: rgba(244, 33, 46, 0.1);
                            color: var(--danger);
                            border: 1px solid rgba(244, 33, 46, 0.2);
                        }
                    }

                    .result-title {
                        font-size: 1.5rem;
                        font-weight: 700;

                        &.clear { 
                            color: var(--success); 
                        }

                        &.flagged { 
                            color: var(--danger); 
                        }
                    }
                }

                .result-details {
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                    background: rgba(0, 0, 0, 0.2);
                    border: 1px solid var(--glass-border);
                    border-radius: 16px;
                    padding: 16px;

                    .detail-row {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        padding: 8px;

                        .detail-label {
                            color: var(--text-secondary);
                        }

                        .detail-value {
                            font-weight: 600;
                            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
                            color: var(--text-primary);
                        }

                        @media (max-width: 400px) {
                            .detail-label {
                                font-size: 0.9rem;
                            }

                            .detail-value {
                                font-size: 0.9rem;
                            }
                        }
                    }
                }
            }

            .error-message {
                width: 100%;
                text-align: center;
                margin-top: 24px;
                background: rgba(244, 33, 46, 0.1);
                border: 1px solid rgba(244, 33, 46, 0.2);
                border-radius: 16px;
                padding: 16px;
                color: var(--danger);
                display: none;
                font-weight: 500;

                &.visible {
                    display: block;
                    animation: fadeIn 0.3s ease;
                }
            }
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;

            a {
                color: var(--text-primary);
                text-decoration: none;
                border-bottom: 1px solid var(--border);
                padding-bottom: 2px;
                transition: all 0.2s;

                &:hover {
                    color: var(--accent);
                    border-color: var(--accent);
                }
            }
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-size: inherit;
            line-height: 1;
            vertical-align: middle;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 
            to { 
                transform: rotate(360deg); 
            } 
        }
        
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
             from { 
                opacity: 0; 
            }
             to { 
                opacity: 1; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">
                <a style="text-decoration: none; color: inherit;" href="/">reverse.watch</a>
            </div>
            <p class="subtitle">Check if a Steam ID has a history of trade reversals</p>
        </header>

        <div class="search-card">
            <form id="searchForm">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="steamIdInput" 
                        placeholder="Steam ID or profile URL"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="searchBtn">Check History</button>
                </div>
                <p class="hint">Paste a 64-bit Steam ID or a Steam profile link</p>
            </form>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-header">
                <div class="status-icon" id="statusIcon"></div>
                <div class="result-title" id="resultTitle"></div>
            </div>
            <div class="result-details">
                <div class="detail-row">
                    <span class="detail-label">Steam ID</span>
                    <span class="detail-value" id="resultSteamId"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status</span>
                    <span class="detail-value" id="resultStatus"></span>
                </div>
                <div class="detail-row" id="lastReversalRow" style="display: none">
                    <span class="detail-label">Last Reversal</span>
                    <span class="detail-value" id="resultLastReversal"></span>
                </div>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>

    <footer>
        <p>Powered by <a href="https://csfloat.com" target="_blank">CSFloat</a></p>
    </footer>

    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('steamIdInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultCard = document.getElementById('resultCard');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const steamId = input.value.trim();
            if (!steamId) {
                return;
            }

            resultCard.classList.remove('visible');
            errorMessage.classList.remove('visible');

            searchBtn.disabled = true;
            searchBtn.innerHTML = '<span class="loading"></span>';

            try {
                const resolvedSteamId = await resolveSteamId(steamId);
                const response = await fetch(`/api/v1/users/${encodeURIComponent(resolvedSteamId)}`);
                if (!response.ok) {
                    const errorData = await response.json();

                    let errorStr = `${errorData.code} - ${errorData.message}`
                    if (errorData.details) {
                        errorStr += ` (${errorData.details})`;
                    }
                    throw new Error(errorStr);
                }

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                showError(error.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Check History';
            }
        });

        async function resolveSteamId(input) {
            const trimmed = input.trim();
            if (!trimmed) {
                throw new Error('missing input');
            }

            // If it already looks like a SteamID64, skip the resolve endpoint.
            if (/^\d{16,20}$/.test(trimmed)) {
                return trimmed;
            }

            const res = await fetch(`/api/v1/steam/resolve-vanity?vanityUrl=${encodeURIComponent(trimmed)}`);
            if (!res.ok) {
                let msg = 'could not resolve steam id';
                try {
                    const errorData = await res.json();
                    msg = `${errorData.code} - ${errorData.message}` + (errorData.details ? ` (${errorData.details})` : '');
                } catch (_) {}
                throw new Error(msg);
            }

            const data = await res.json();
            if (!data || !data.steam_id) {
                throw new Error('invalid response from resolve endpoint');
            }
            return data.steam_id;
        }

        function displayResult(data) {
            const statusIcon = document.getElementById('statusIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultSteamId = document.getElementById('resultSteamId');
            const resultStatus = document.getElementById('resultStatus');
            const lastReversalRow = document.getElementById('lastReversalRow');
            const resultLastReversal = document.getElementById('resultLastReversal');

            resultSteamId.textContent = data.steam_id;

            resultCard.classList.remove('flagged', 'clear');

            if (data.has_reversed) {
                resultCard.classList.add('flagged');
                statusIcon.className = 'status-icon flagged';
                statusIcon.innerHTML = `<span class="material-symbols-outlined">priority_high</span>`;

                resultTitle.className = 'result-title flagged';
                resultTitle.textContent = 'Reversal History Found';

                resultStatus.textContent = 'Has reversed';
                resultStatus.style.color = 'var(--danger)';

                if (data.last_reversal_timestamp) {
                    lastReversalRow.style.display = 'flex'

                    const date = new Date(data.last_reversal_timestamp);
                    resultLastReversal.textContent = date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                } else {
                    lastReversalRow.style.display = 'none';
                }
            } else {
                resultCard.classList.add('clear');
                statusIcon.className = 'status-icon clear';
                statusIcon.innerHTML = `<span class="material-symbols-outlined">check</span>`;

                resultTitle.className = 'result-title clear';
                resultTitle.textContent = 'No Reversals Found';

                resultStatus.textContent = 'Clear';
                resultStatus.style.color = 'var(--success)';

                lastReversalRow.style.display = 'none';
            }

            resultCard.classList.add('visible');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('visible');
        }

        input.addEventListener('input', () => {
            errorMessage.classList.remove('visible');
        });
    </script>
</body>
</html>
